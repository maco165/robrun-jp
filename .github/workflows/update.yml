name: Update news

# 公式ニュースの取得・要約・検査・コミット・ビルド・公開を毎時と手動で行う (PJ-030 の R-5)。
# GITHUB_TOKEN での push は別の workflow (deploy.yml) を起こさないので、公開までここで行う。
# 2 つの job に分ける: 記事を作ってコミットしビルドする job (contents: write) と、公開する job (pages・id-token・environment)。
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      fixture:
        description: '見本の入力で走らせる (取得と要約に見本を使い、コミットと公開を飛ばす)'
        type: boolean
        default: false

permissions:
  contents: read

# deploy.yml の main の公開と同じ並びにする (人のマージの公開と重ねず、古いコードで上書きしない)。走っている回は止めない
concurrency:
  group: pages-refs/heads/main
  cancel-in-progress: false

jobs:
  update:
    # main だけで走る (手動の回で別のブランチを選んでも、記事を書かない)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
    env:
      FIXTURE: ${{ inputs.fixture == true }}
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 見本の回は、取得・要約・版の書き込みをすべて .cache/ と見本のファイルに向け、data/ を書き換えない
      - name: 取得
        run: |
          if [ "$FIXTURE" = "true" ]; then
            mkdir -p .cache && cp tests/fixtures/empty-news.json .cache/news.json
            npm run fetch:news -- --fixture tests/fixtures/steam-news.json --news .cache/news.json --skipped tests/fixtures/empty-news.json
          else
            npm run fetch:news
          fi

      # 要約できなかった記事は data/skipped.json に回数を残し (断られたら 1 回、それ以外は 3 回で取らなくなる)、
      # 要約できた記事だけを news.json に入れる。失敗があっても、要約できた分のコミットと公開は続け、警告を出す。
      # 1 回は 5 件まで (溜まった分は次の回)。1 件ごとに書き出すので、この段が時間切れで止まっても要約できた分と失敗の回数は残る
      - name: 要約
        timeout-minutes: 12
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ "$FIXTURE" = "true" ]; then
            cp data/versions.json .cache/versions.json && echo '[]' > .cache/skipped.json
            npm run summarize -- --mock tests/fixtures/summary-mock.json --news .cache/news.json --versions .cache/versions.json --skipped .cache/skipped.json \
              || echo "SUMMARIZE_FAILED=1" >> "$GITHUB_ENV"
            npx tsx scripts/check-news.ts .cache/news.json
          elif [ "$HAS_KEY" != "true" ]; then
            echo "::warning::ANTHROPIC_API_KEY が Secrets にありません。要約を飛ばします (取得した記事は次の回にまた取ります)"
          else
            npm run summarize || echo "SUMMARIZE_FAILED=1" >> "$GITHUB_ENV"
          fi

      - run: npm run check:repo
      - run: npm run check:data
      - run: npm run check:news

      # 走っている間に main が進んでも push が弾かれないよう、main の最新に載せてから push する
      - name: コミット (差分があるときだけ)
        id: commit
        if: env.FIXTURE != 'true'
        run: |
          git add data/news.json data/versions.json data/skipped.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "記事を更新する (公式ニュースの要約)"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "記事の変更なし"
            git pull --ff-only origin main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # main の最新 (記事のコミットを含む) から組む
      - if: env.FIXTURE != 'true'
        run: npm run build

      - if: env.FIXTURE != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # 失敗にすると公開の job が走らないので警告にとどめる (失敗の回数は skipped.json で 3 回までに止まる)
      - name: 要約できなかった記事があれば警告する
        if: env.SUMMARIZE_FAILED == '1'
        run: echo "::warning::要約できなかった記事があります (要約の段の NG 行と data/skipped.json を見る)"

  deploy:
    needs: update
    if: needs.update.outputs.commit != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: 公開まで届いたか (build.json の commit)
        env:
          WANT: ${{ needs.update.outputs.commit }}
        run: |
          got=''
          for i in $(seq 1 20); do
            got=$(curl -fsS "https://maco165.github.io/robrun-jp/build.json?t=$(date +%s)" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).commit))" || true)
            if [ "$got" = "$WANT" ]; then echo "公開を確かめた ($WANT)"; exit 0; fi
            sleep 15
          done
          echo "::error::公開の build.json の commit ($got) が $WANT になりません"
          exit 1
