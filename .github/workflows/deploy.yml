name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# main の回 (人のマージと、NucBox5 の毎時の記事の push) は走っている回を止めず、順に公開する。PR の回だけ古い回を止める
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      # 取得した公式の本文 (.cache/) が追跡されていたら止める
      - run: npm run check:repo
      - run: npm run check:data
      - run: npm run check:news
      - run: npm test
      - run: npm run build
      # 見本の記事 (tests/fixtures/) で別のフォルダ (dist-e2e) に組み、1280px と 390px でページを開いて確かめる
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
